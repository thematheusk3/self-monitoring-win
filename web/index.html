<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Self Monitoring</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icon.svg" alt="" width="28" height="28">
      <div>
        <div class="host" id="host">—</div>
        <div class="sub" id="host-sub"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
    <div class="top-actions">
      <a class="icon-btn bell" href="#alerts" id="bell" title="Alertas" aria-label="Alertas" hidden>🔔<span class="badge" hidden></span></a>
      <span class="live" id="live" title="Conexão"><span class="dot"></span><span class="live-label">Conectando</span><span class="live-ago"></span></span>
      <button class="icon-btn" id="theme-btn" title="Alternar tema" aria-label="Alternar tema">◐</button>
    </div>
  </header>

  <main id="views"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="sheet" id="sheet"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
